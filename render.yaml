# Render Blueprint — EGentid Spa & Service
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy:
# 1. Open https://YOUR-SERVICE.onrender.com/admin/
# 2. Log in with DJANGO_SUPERUSER_USERNAME / DJANGO_SUPERUSER_PASSWORD (see Environment)
# 3. Each deploy applies cms/content_snapshot (local pages/gallery/images)
# 4. Admin → Webbplatsinställningar → set public_site_url if you use a custom domain
#    (otherwise seed fills it from PUBLIC_SITE_URL / RENDER_EXTERNAL_URL)
# 5. Render → Environment → set SENDGRID_API_KEY (or EMAIL_* SMTP vars) for booking/contact mail
# Reset content intentionally: python manage.py seed_site --force

databases:
  - name: egentid-db
    databaseName: egentid
    user: egentid
    plan: free
    # Render default is 18; set explicitly so blueprint matches the dashboard.
    postgresMajorVersion: "18"

services:
  - type: web
    name: egentidsparesurs
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: egentid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        # Add your custom domain later, e.g. egentidsparesurs.se,.onrender.com
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        # Set after first deploy to https://YOUR-SERVICE.onrender.com
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_MEDIA
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@egentidsparesurs.se
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      # true = run safe seed on boot (fills gaps only; does not wipe admin edits)
      - key: SEED_ON_DEPLOY
        value: "true"
      # Outgoing mail — set SENDGRID_API_KEY in Render dashboard (sync: false keeps it secret).
      # Verify DEFAULT_FROM_EMAIL as a sender in SendGrid (Single Sender or domain auth).
      - key: DEFAULT_FROM_EMAIL
        value: info@egentidspaservice.se
      - key: CONTACT_INBOX
        value: info@egentidspaservice.se
      - key: PUBLIC_SITE_URL
        # Set to your live https URL (custom domain when you have one). Empty = Render URL.
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Alternative: generic SMTP (uncomment and set in dashboard instead of SendGrid)
      # - key: EMAIL_HOST
      #   sync: false
      # - key: EMAIL_PORT
      #   value: "587"
      # - key: EMAIL_HOST_USER
      #   sync: false
      # - key: EMAIL_HOST_PASSWORD
      #   sync: false
      # - key: EMAIL_USE_TLS
      #   value: "true"
    # Remove disk block if your plan has no disks (app falls back to ./media).
    disk:
      name: egentid-media
      mountPath: /var/data
      sizeGB: 1
